name: build-zh
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: checkout-own
        uses: actions/checkout@v4
      - name: prep
        run: |
          set -x
          ls -la
          test -f kit.zip || (echo "MISSING kit.zip in repo root"; exit 1)
          unzip -o kit.zip -d /tmp/kit
          # 用补丁对应的那个确切提交的快照，避免上游更新导致上下文不匹配
          curl -L -o /tmp/src.tar.gz "https://github.com/starling-client/starling/archive/5432370d573642041585c69b40fb045b27133488.tar.gz"
          tar xzf /tmp/src.tar.gz
          mv starling-5432370d573642041585c69b40fb045b27133488 starling
          cd starling
          git init -q .
          git apply --verbose /tmp/kit/汉化改动.patch || patch -p1 --forward < /tmp/kit/汉化改动.patch
          cp /tmp/kit/CJK-Regular.ttf /tmp/kit/CJK-Medium.ttf /tmp/kit/CJK-Bold.ttf crates/horizon-theme/fonts/
          sed -i 's/^codegen-units = 1$/codegen-units = 256/' Cargo.toml
          grep -c "推荐" crates/horizon-client/src/android_control_ui.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starling
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: sdk
        run: |
          yes | sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
      - name: compile
        working-directory: starling
        run: cargo ndk -t arm64-v8a --platform 26 build --profile quick -p horizon-android
      - name: package
        working-directory: starling
        run: |
          python3 packaging/android/build_apk.py --no-build --profile quick
          find . -name "*.apk" | head
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: starling/**/*.apk
          if-no-files-found: warn
          retention-days: 30
